<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="/src/style.css" rel="stylesheet" />
  <title>kitty-clicker</title>
</head>

<body class=" flex flex-col h-screen">
  <header class="bg-[#ece3ca] text-[#a68a64] italic text-5xl text-center">
    Kitty Clicker
  </header>

  <main class="flex flex-1 ">
    <div id="colorwave" class="flex-1 flex flex-col items-center justify-center bg-[#333d29]">
      <p id="scoreDisplay" class="flex-1 text-center text-5xl italic text-[#a68a64]">
        cat points
      </p>
      <button id="clicker">
        <img src="/src/assets/cat.png" alt="cat picture!">
      </button>
    <p class="flex-1 text-center text-2xl italic text-[#a68a64]">
      pet the cat to earn cat points!
    </div>


    <div id="colorswap" class="flex-2 bg-[#333d29]">
      <button id="upgrade1" class="w-full h-16 bg-[#a68a64] text-[#333d29] text-2xl italic">
        Upgrade 1 <br> Buy a treat (10 points) You have
      </button>
      <hr class="rainbow-box">
      <button id="upgrade2" class="w-full h-16 bg-[#a68a64] text-[#333d29] text-2xl italic">
        Upgrade 2 <br> Buy a toy (100 points) You have
      </button>
      <hr class="rainbow-box">
      <button id="upgrade3" class="w-full h-16 bg-[#a68a64] text-[#333d29] text-2xl italic">
        Upgrade 3 <br> Buy a catnip (1000 points) You have
      </button>
      <hr class="rainbow-box">
    </div>
    


  </main>
  <script type="module" src="/src/main.js"></script>
  
</body>
</html>
